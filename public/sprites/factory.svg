  <line x1="70" y1="20" x2="82" y2="20" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>
  <line x1="70" y1="30" x2="82" y2="30" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>

