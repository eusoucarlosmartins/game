  <!-- Linha 1 -->
  <rect x="10" y="50" width="10" height="12" fill="#a8c8d8"/>
  <rect x="10" y="50" width="10" height="12" fill="none" stroke="#3a1f0a" stroke-width="0.6"/>
  <line x1="15" y1="50" x2="15" y2="62" stroke="#3a1f0a" stroke-width="0.4"/>
