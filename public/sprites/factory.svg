  <line x1="30" y1="110" x2="60" y2="110" stroke="#5a2010" stroke-width="0.6"/>
  <!-- Maçanetas -->
  <circle cx="42" cy="105" r="1" fill="#c69042"/>
  <circle cx="48" cy="105" r="1" fill="#c69042"/>
