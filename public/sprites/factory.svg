<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 130" shape-rendering="crispEdges">
  <!-- Sombra -->
  <ellipse cx="45" cy="128" rx="38" ry="3" fill="rgba(0,0,0,0.3)"/>

