  <line x1="10" y1="76" x2="20" y2="76" stroke="#3a1f0a" stroke-width="0.4"/>

  <rect x="24" y="70" width="10" height="12" fill="#a8c8d8"/>
  <rect x="24" y="70" width="10" height="12" fill="none" stroke="#3a1f0a" stroke-width="0.6"/>
  <line x1="29" y1="70" x2="29" y2="82" stroke="#3a1f0a" stroke-width="0.4"/>
  <line x1="24" y1="76" x2="34" y2="76" stroke="#3a1f0a" stroke-width="0.4"/>

  <rect x="38" y="70" width="10" height="12" fill="#a8c8d8"/>
  <rect x="38" y="70" width="10" height="12" fill="none" stroke="#3a1f0a" stroke-width="0.6"/>
  <line x1="43" y1="70" x2="43" y2="82" stroke="#3a1f0a" stroke-width="0.4"/>
  <line x1="38" y1="76" x2="48" y2="76" stroke="#3a1f0a" stroke-width="0.4"/>

  <rect x="52" y="70" width="10" height="12" fill="#a8c8d8"/>
  <rect x="52" y="70" width="10" height="12" fill="none" stroke="#3a1f0a" stroke-width="0.6"/>
  <line x1="57" y1="70" x2="57" y2="82" stroke="#3a1f0a" stroke-width="0.4"/>
  <line x1="52" y1="76" x2="62" y2="76" stroke="#3a1f0a" stroke-width="0.4"/>

