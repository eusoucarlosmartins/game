<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" shape-rendering="crispEdges">
  <!-- Sombra -->
  <ellipse cx="90" cy="176" rx="60" ry="4" fill="rgba(0,0,0,0.3)"/>

  <!-- Colina marrom (shape de domo) -->
  <path d="M4 170 Q4 60, 90 20 Q176 60, 176 170 Z" fill="#8a5a30"/>
  <!-- Sombra lateral direita -->
  <path d="M90 20 Q176 60 176 170 L170 170 Q170 65, 90 25 Z" fill="rgba(0,0,0,0.15)"/>

  <!-- Textura de pedrinhas na colina -->
  <circle cx="30" cy="90" r="1.5" fill="#5a3416"/>
  <circle cx="50" cy="60" r="1.5" fill="#5a3416"/>
  <circle cx="140" cy="80" r="1.5" fill="#5a3416"/>
  <circle cx="20" cy="130" r="1.5" fill="#5a3416"/>
  <circle cx="155" cy="130" r="1.5" fill="#5a3416"/>
  <circle cx="60" cy="140" r="1.5" fill="#5a3416"/>
  <circle cx="130" cy="150" r="1.5" fill="#5a3416"/>
  <circle cx="85" cy="40" r="1.5" fill="#5a3416"/>
  <circle cx="110" cy="55" r="1.5" fill="#5a3416"/>

  <!-- Vegetação no topo -->
  <circle cx="80" cy="30" r="4" fill="#4a6a3a"/>
  <circle cx="95" cy="25" r="5" fill="#5a7a4a"/>
  <circle cx="105" cy="32" r="4" fill="#4a6a3a"/>

  <!-- Entrada da caverna (arco escuro) -->
  <path d="M60 160 L60 110 Q60 90 90 90 Q120 90 120 110 L120 160 Z" fill="#1a0e06"/>
  <!-- Fundo super escuro -->
  <path d="M65 155 L65 112 Q65 95 90 95 Q115 95 115 112 L115 155 Z" fill="#000"/>

  <!-- Vigas de madeira do arco -->
  <!-- Verticais esquerda e direita -->
  <rect x="54" y="110" width="7" height="52" fill="#5a3416"/>
  <rect x="119" y="110" width="7" height="52" fill="#5a3416"/>
  <!-- Horizontal superior -->
  <rect x="54" y="104" width="72" height="8" fill="#5a3416"/>
  <!-- Detalhes verticais da trave superior -->
  <rect x="62" y="104" width="2" height="8" fill="#3a1f0a"/>
  <rect x="88" y="104" width="2" height="8" fill="#3a1f0a"/>
  <rect x="114" y="104" width="2" height="8" fill="#3a1f0a"/>

  <!-- Trilhos saindo da caverna -->
  <rect x="78" y="160" width="2" height="18" fill="#3a1f0a"/>
  <rect x="100" y="160" width="2" height="18" fill="#3a1f0a"/>
  <!-- Dormentes -->
  <rect x="74" y="164" width="30" height="2" fill="#5a3416"/>
  <rect x="72" y="170" width="34" height="2" fill="#5a3416"/>
  <rect x="70" y="176" width="38" height="2" fill="#5a3416"/>

  <!-- Mini carrinho parado na entrada -->
  <rect x="80" y="150" width="20" height="10" fill="#5a3416"/>
  <rect x="80" y="150" width="20" height="2" fill="#3a1f0a"/>
  <!-- rodas -->
  <circle cx="84" cy="162" r="3" fill="#1a0e06"/>
  <circle cx="96" cy="162" r="3" fill="#1a0e06"/>
  <circle cx="84" cy="162" r="1" fill="#555"/>
  <circle cx="96" cy="162" r="1" fill="#555"/>
  <!-- Carga preta -->
  <rect x="82" y="146" width="16" height="5" fill="#1f1c1a"/>

  <!-- Placa pendurada acima -->
  <!-- Deixada pra ser renderizada pelo canvas em cima -->
</svg>
