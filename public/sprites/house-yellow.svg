<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 70" shape-rendering="crispEdges">
  <!-- Sombra -->
  <ellipse cx="20" cy="68" rx="18" ry="2" fill="rgba(0,0,0,0.3)"/>

  <!-- Base/rodapé escuro -->
  <rect x="2" y="60" width="36" height="5" fill="#3a1f0a"/>

  <!-- Paredes amarelas -->
  <rect x="2" y="18" width="36" height="42" fill="#e8c87a"/>
  <!-- Sombreamento à direita -->
  <rect x="34" y="18" width="4" height="42" fill="#c9a85e"/>

  <!-- Telhado triangular vermelho tipo telha -->
  <polygon points="-2,18 20,2 42,18" fill="#a82e1c"/>
  <!-- Ripas das telhas -->
  <line x1="5" y1="16" x2="12" y2="10" stroke="#1a0e06" stroke-width="0.5"/>
  <line x1="12" y1="10" x2="20" y2="5" stroke="#1a0e06" stroke-width="0.5"/>
  <line x1="20" y1="5" x2="28" y2="10" stroke="#1a0e06" stroke-width="0.5"/>
  <line x1="28" y1="10" x2="35" y2="16" stroke="#1a0e06" stroke-width="0.5"/>
  <!-- Beiral sombra -->
  <rect x="-2" y="18" width="44" height="2" fill="rgba(0,0,0,0.2)"/>

  <!-- Janela esquerda -->
  <rect x="6" y="28" width="10" height="12" fill="#a8c8d8"/>
  <rect x="6" y="28" width="10" height="12" fill="none" stroke="#3a1f0a" stroke-width="0.8"/>
  <line x1="11" y1="28" x2="11" y2="40" stroke="#3a1f0a" stroke-width="0.5"/>
  <line x1="6" y1="34" x2="16" y2="34" stroke="#3a1f0a" stroke-width="0.5"/>
  <!-- Peitoril -->
  <rect x="4" y="40" width="14" height="1.5" fill="#5a3416"/>

  <!-- Janela direita -->
  <rect x="24" y="28" width="10" height="12" fill="#a8c8d8"/>
  <rect x="24" y="28" width="10" height="12" fill="none" stroke="#3a1f0a" stroke-width="0.8"/>
  <line x1="29" y1="28" x2="29" y2="40" stroke="#3a1f0a" stroke-width="0.5"/>
  <line x1="24" y1="34" x2="34" y2="34" stroke="#3a1f0a" stroke-width="0.5"/>
  <!-- Peitoril -->
  <rect x="22" y="40" width="14" height="1.5" fill="#5a3416"/>

  <!-- Porta -->
  <rect x="16" y="47" width="8" height="13" fill="#5a3416"/>
  <!-- Detalhe vertical -->
  <line x1="20" y1="47" x2="20" y2="60" stroke="#3a1f0a" stroke-width="0.8"/>
  <!-- Maçaneta -->
  <circle cx="22" cy="54" r="0.8" fill="#c69042"/>

  <!-- Chaminé no telhado -->
  <rect x="28" y="4" width="4" height="10" fill="#8a4a2a"/>
  <rect x="27" y="4" width="6" height="2" fill="#1a0e06"/>
</svg>
